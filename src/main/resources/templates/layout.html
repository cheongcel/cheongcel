<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:attr="data-theme=${siteTheme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | cheongcel">cheongcel</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- 테마별 스타일: static/themes/<테마>/theme.css -->
    <link rel="stylesheet" th:href="@{/themes/{t}/theme.css(t=${siteTheme})}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body>

<!-- 테마별 배경/장식: templates/themes/<테마>/decor.html -->
<th:block th:replace="~{themes/__${siteTheme}__/decor :: decor}"></th:block>

<nav class="nav">
    <a th:href="@{/}" class="nav-logo">
        <img src="/images/logo-cc.png" alt="cheongcel" class="logo-img">
    </a>
    <div class="nav-links">
        <a th:href="@{/archive}" th:classappend="${currentUri != null and currentUri.startsWith('/archive')} ? 'active'">Archive</a>
        <a th:href="@{/about}" th:classappend="${currentUri != null and currentUri.startsWith('/about')} ? 'active'">About</a>
        <a th:href="@{/contact}" th:classappend="${currentUri != null and currentUri.startsWith('/contact')} ? 'active'">Contact</a>
    </div>
</nav>

<main layout:fragment="content">
</main>

<footer class="footer">
    <span class="footer-logo">cheongcel</span>
    <span>© 2025 cheongcel. All rights reserved.</span>
</footer>

<th:block th:replace="~{themes/__${siteTheme}__/decor :: scripts}"></th:block>

</body>
</html>
