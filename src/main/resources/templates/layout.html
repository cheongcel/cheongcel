<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | cheongcel">cheongcel</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="cursor"></div>
<canvas id="particle-canvas" style="display:none;"></canvas>

<nav class="nav">
    <a th:href="@{/}" class="nav-logo">cheongcel</a>
    <div class="nav-links">
        <a th:href="@{/gallery}" th:classappend="${currentUri != null and currentUri.startsWith('/gallery')} ? 'active'">Gallery</a>
        <a th:href="@{/shop}" th:classappend="${currentUri != null and currentUri.startsWith('/shop')} ? 'active'">Shop</a>
        <a th:href="@{/project}" th:classappend="${currentUri != null and currentUri.startsWith('/project')} ? 'active'">Project</a>
        <a th:href="@{/about}" th:classappend="${currentUri != null and currentUri.startsWith('/about')} ? 'active'">About</a>
    </div>
</nav>

<main layout:fragment="content">
</main>

<footer class="footer">
    <span class="footer-logo">cheongcel</span>
    <span>© 2025 cheongcel. All rights reserved.</span>
</footer>

<script>
    const cursor = document.getElementById('cursor');

    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    document.addEventListener('mousedown', () => cursor.classList.add('click'));
    document.addEventListener('mouseup', () => cursor.classList.remove('click'));
</script>

</body>
</html>
