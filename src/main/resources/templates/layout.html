<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | cheongcel">cheongcel</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="star-field" id="star-field"></div>
<div id="cursor"></div>

<nav class="nav">
    <a th:href="@{/}" class="nav-logo">
        <img src="/images/logo-cc.png" alt="cheongcel" class="logo-img">
    </a>
    <div class="nav-links">
        <a th:href="@{/archive}" th:classappend="${currentUri != null and currentUri.startsWith('/archive')} ? 'active'">Archive</a>
        <a th:href="@{/about}" th:classappend="${currentUri != null and currentUri.startsWith('/about')} ? 'active'">About</a>
        <a th:href="@{/contact}" th:classappend="${currentUri != null and currentUri.startsWith('/contact')} ? 'active'">Contact</a>
    </div>
</nav>

<main layout:fragment="content">
</main>

<footer class="footer">
    <span class="footer-logo">cheongcel</span>
    <span>© 2025 cheongcel. All rights reserved.</span>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });
    document.addEventListener('mousedown', () => cursor.classList.add('click'));
    document.addEventListener('mouseup', () => cursor.classList.remove('click'));

    const field = document.getElementById('star-field');
    const count = 320;
    let html = '';
    for (let i = 0; i < count; i++) {
        const top = Math.random() * 100;
        const left = Math.random() * 100;
        const size = (Math.random() * 2.2 + 0.6).toFixed(1);
        const twinkleDuration = (Math.random() * 3 + 1.5).toFixed(1);
        const twinkleDelay = (Math.random() * 4).toFixed(1);
        const driftDuration = (Math.random() * 8 + 6).toFixed(1);
        const driftDelay = (Math.random() * 6).toFixed(1);
        const dx = (Math.random() * 46 - 23).toFixed(0);
        const dy = (Math.random() * 56 - 28).toFixed(0);
        html += '<span class="star" style="'
            + 'top:' + top + '%;'
            + 'left:' + left + '%;'
            + 'width:' + size + 'px;'
            + 'height:' + size + 'px;'
            + '--dx:' + dx + 'px;'
            + '--dy:' + dy + 'px;'
            + 'animation-duration:' + twinkleDuration + 's,' + driftDuration + 's;'
            + 'animation-delay:' + twinkleDelay + 's,' + driftDelay + 's;'
            + '"></span>';
    }
    field.innerHTML = html;
});
</script>

</body>
</html>
