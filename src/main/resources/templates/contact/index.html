<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Contact</title></head>
<body>
<main layout:fragment="content">

    <section class="section" style="border-top:none;">
        <div class="sec-head">
            <h2>Contact</h2>
        </div>

        <div class="contact-grid">
            <a href="https://github.com/cheongcel" target="_blank" class="contact-tile">
                <i class="ti ti-brand-github contact-icon" aria-hidden="true"></i>
                <div class="contact-tile-label">GitHub</div>
                <div class="contact-tile-sub">cheongcel</div>
            </a>
            <a href="https://www.linkedin.com/in/eunjiyoo-" target="_blank" class="contact-tile">
                <i class="ti ti-brand-linkedin contact-icon" aria-hidden="true"></i>
                <div class="contact-tile-label">LinkedIn</div>
                <div class="contact-tile-sub">eunjiyoo-</div>
            </a>
            <a href="mailto:andfrank@naver.com" class="contact-tile contact-tile-wide">
                <i class="ti ti-mail contact-icon" aria-hidden="true"></i>
                <div class="contact-tile-label">Email</div>
                <div class="contact-tile-sub">andfrank@naver.com</div>
            </a>
        </div>
    </section>

</main>
</body>
</html>
