<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${project.title}">Project</title></head>
<body>
<main layout:fragment="content">

    <section class="section" style="border-top:none;">
        <a th:href="@{/archive}" class="back-link">← Archive</a>

        <h1 class="detail-title" th:text="${project.title}">Project Title</h1>
        <p class="detail-date" th:text="${#temporals.format(project.projectDate, 'yyyy.MM')}">2025.01</p>
        <p class="detail-desc" th:text="${project.description}">Description</p>

        <div class="detail-tags" th:if="${project.techStack != null}">
            <span class="atag" th:each="tech : ${#strings.arraySplit(project.techStack, ',')}" th:text="${tech.trim()}">Tech</span>
        </div>

        <div class="detail-links">
            <a th:if="${project.liveUrl != null}" th:href="${project.liveUrl}" target="_blank" class="btn-link">Live Site →</a>
        </div>

        <!-- 작품 소개 글 (Project.story 가 있을 때만 보임) -->
        <div class="detail-story" th:if="${project.story != null and not #strings.isEmpty(project.story)}">
            <h2 class="detail-sub">About this work</h2>
            <p th:text="${project.story}">작품 소개</p>
        </div>

        <!-- 사용 사진 (Project.shots 가 있을 때만 보임. "주소|설명" 을 콤마로 이어서 저장) -->
        <div class="detail-shots" th:if="${project.shots != null and not #strings.isEmpty(project.shots)}">
            <h2 class="detail-sub">In use</h2>
            <div class="shots-grid">
                <figure th:each="shot : ${#strings.arraySplit(project.shots, ',')}"
                        th:with="parts=${#strings.arraySplit(shot.trim(), '|')}">
                    <img th:src="${parts[0].trim()}" th:alt="${parts.length > 1 ? parts[1].trim() : project.title}" loading="lazy">
                    <figcaption th:if="${parts.length > 1}" th:text="${parts[1].trim()}">설명</figcaption>
                </figure>
            </div>
        </div>
    </section>

</main>
</body>
</html>
