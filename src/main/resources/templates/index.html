<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>cheongcel</title>
</head>
<body>
<main layout:fragment="content">

    <section class="hero">
        <canvas id="star-canvas"></canvas>
        <div class="hero-title">
            <span class="line">cheong</span>
            <span class="line">cel</span>
        </div>
    </section>

    <section class="section">
        <div class="sec-head">
            <h2>Archive</h2>
            <a th:href="@{/archive}">view all →</a>
        </div>
        <div class="arc-grid" th:if="${not #lists.isEmpty(projects)}">
            <a class="arc-card" th:each="project, iter : ${projects}"
               th:href="@{/archive/{id}(id=${project.id})}"
               th:classappend="${'c' + (iter.index % 3 + 1)}"
               th:style="${project.posterUrl != null} ? 'background-image:url(' + ${project.posterUrl} + ');background-size:cover;background-position:center;' : ''">
                <span class="card-tag" th:text="${#temporals.format(project.projectDate, 'yyyy.MM')}">2025.01</span>
                <div class="card-info">
                    <div class="card-title" th:text="${project.title}">Project</div>
                    <div class="card-sub" th:text="${project.description}">Description</div>
                </div>
            </a>
        </div>
        <p class="empty-msg" th:if="${#lists.isEmpty(projects)}">아직 등록된 프로젝트가 없어요.</p>
    </section>

</main>

<script>
const canvas = document.getElementById('star-canvas');
if (canvas) {
    const ctx = canvas.getContext('2d');
    const hero = canvas.parentElement;
    function resize(){ canvas.width = hero.offsetWidth; canvas.height = hero.offsetHeight; }
    resize();
    window.addEventListener('resize', resize);

    const stars = Array.from({length: 180}, () => ({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.4+0.2,
        twinkle: Math.random()*Math.PI*2,
        speed: Math.random()*0.02+0.008
    }));

    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        stars.forEach(s => {
            s.twinkle += s.speed;
            const a = 0.15 + 0.55*Math.sin(s.twinkle);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(210,210,255,' + Math.max(0,a).toFixed(2) + ')';
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
}
</script>

</body>
</html>
