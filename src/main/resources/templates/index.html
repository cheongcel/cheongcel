<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>cheongcel</title>
</head>
<body>
<main layout:fragment="content">

    <section class="hero">
        <div class="hero-title">
            <span class="line">cheong</span>
            <span class="line">cel</span>
        </div>
    </section>

    <section class="section">
        <div class="sec-head">
            <h2>Archive</h2>
            <a th:href="@{/archive}">view all →</a>
        </div>
        <div class="arc-grid" th:if="${not #lists.isEmpty(projects)}">
            <a th:each="project, iter : ${projects}"
               th:href="@{/archive/{id}(id=${project.id})}"
               th:class="${project.coinImageUrl != null} ? 'arc-card coin-card' : 'arc-card ' + ('c' + (iter.index % 3 + 1))"
               th:style="${project.coinImageUrl != null} ? 'background:' + ${project.coinBgColor ?: '#d9c7d3'} + ';' : (${project.posterUrl != null} ? 'background-image:url(' + ${project.posterUrl} + ');background-size:cover;background-position:center;' : '')">
                <div class="coin-spin" th:if="${project.coinImageUrl != null}">
                    <img class="front" th:src="${project.coinImageUrl}" alt="">
                    <img class="back" th:src="${project.coinImageUrl}" alt="">
                </div>
                <span class="card-tag" th:text="${#temporals.format(project.projectDate, 'yyyy.MM')}">2025.01</span>
                <div class="card-info">
                    <div class="card-title" th:text="${project.title}">Project</div>
                    <div class="card-sub" th:text="${project.description}">Description</div>
                </div>
            </a>
        </div>
        <p class="empty-msg" th:if="${#lists.isEmpty(projects)}">아직 등록된 프로젝트가 없어요.</p>
    </section>

</main>
</body>
</html>
