<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>cheongcel</title>
</head>
<body>
<main layout:fragment="content">

    <section class="hero">
        <div class="star-field" id="star-field"></div>
        <div class="hero-title">
            <span class="line">cheong</span>
            <span class="line">cel</span>
        </div>
    </section>

    <section class="section">
        <div class="sec-head">
            <h2>Archive</h2>
            <a th:href="@{/archive}">view all →</a>
        </div>
        <div class="arc-grid" th:if="${not #lists.isEmpty(projects)}">
            <a class="arc-card" th:each="project, iter : ${projects}"
               th:href="@{/archive/{id}(id=${project.id})}"
               th:classappend="${'c' + (iter.index % 3 + 1)}"
               th:style="${project.posterUrl != null} ? 'background-image:url(' + ${project.posterUrl} + ');background-size:cover;background-position:center;' : ''">
                <span class="card-tag" th:text="${#temporals.format(project.projectDate, 'yyyy.MM')}">2025.01</span>
                <div class="card-info">
                    <div class="card-title" th:text="${project.title}">Project</div>
                    <div class="card-sub" th:text="${project.description}">Description</div>
                </div>
            </a>
        </div>
        <p class="empty-msg" th:if="${#lists.isEmpty(projects)}">아직 등록된 프로젝트가 없어요.</p>
    </section>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const field = document.getElementById('star-field');
        if (!field) return;
        const count = 120;
        let html = '';
        for (let i = 0; i < count; i++) {
            const top = Math.random() * 100;
            const left = Math.random() * 100;
            const size = (Math.random() * 1.6 + 0.6).toFixed(1);
            const duration = (Math.random() * 3 + 2).toFixed(1);
            const delay = (Math.random() * 4).toFixed(1);
            html += '<span class="star" style="top:' + top + '%;left:' + left + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + duration + 's;animation-delay:' + delay + 's;"></span>';
        }
        field.innerHTML = html;
    });
    </script>

</main>
</body>
</html>
