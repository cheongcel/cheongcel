<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 테마: badge · 오렌지 배경 + 큰 세리프 타이틀 + 양쪽 끈으로 걸린 흔들리는 네임택 -->
<section class="bh" id="bh" th:fragment="hero">

    <p class="bh-side bh-l">I build small things on the internet, season by season. <a th:href="@{/about}">[more]</a></p>

    <h1 class="bh-title" id="bh-title"><span>cheongcel</span></h1>

    <canvas id="bh-rope" aria-hidden="true"></canvas>

    <div class="bh-badge" id="bh-badge">
        <svg class="bh-hw" viewBox="0 0 40 62" width="40" height="62" aria-hidden="true">
            <defs>
                <linearGradient id="bhM" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#585e65"/><stop offset=".22" stop-color="#eceef0"/><stop offset=".5" stop-color="#9ba1a8"/><stop offset=".78" stop-color="#f8f9fa"/><stop offset="1" stop-color="#60666d"/></linearGradient>
                <linearGradient id="bhM2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f8"/><stop offset=".5" stop-color="#8a9097"/><stop offset="1" stop-color="#dcdfe2"/></linearGradient>
            </defs>
            <rect x="7" y="0" width="26" height="17" rx="4" fill="url(#bhM)" stroke="#4f555c" stroke-width=".8"/>
            <path d="M8.5 4.6h23M8.5 8.6h23M8.5 12.6h23" stroke="rgba(0,0,0,.26)" stroke-width=".7" fill="none"/>
            <path d="M10 1.8h20" stroke="rgba(255,255,255,.7)" stroke-width=".8" fill="none"/>
            <ellipse cx="20" cy="22" rx="6" ry="5.4" fill="none" stroke="url(#bhM2)" stroke-width="2.4"/>
            <rect x="15.5" y="26" width="9" height="9" rx="2" fill="url(#bhM)" stroke="#4f555c" stroke-width=".7"/>
            <rect x="12" y="34" width="16" height="23" rx="8" fill="none" stroke="url(#bhM2)" stroke-width="3"/>
            <rect x="12" y="34" width="16" height="23" rx="8" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".6"/>
        </svg>
        <div class="bh-holder"><i class="bh-hole bh-a"></i><i class="bh-slot"></i><i class="bh-hole bh-b"></i></div>
        <div class="bh-card">
            <img class="bh-cc" th:src="@{/themes/badge/cc-badge.png}" alt="">
            <div class="bh-name">cheong<br>cel</div>
            <div class="bh-spacer"></div>
            <div class="bh-lab">Contact</div>
            <div class="bh-val"><a href="mailto:yooeeej@gmail.com">yooeeej@gmail.com</a></div>
            <div class="bh-lab">Archive</div>
            <div class="bh-val"><a href="https://cheongcel.yoossi.dev/" target="_blank" rel="noopener">cheongcel.yoossi.dev</a></div>
            <div class="bh-lab">Elsewhere</div>
            <div class="bh-pills">
                <a class="bh-pill" href="https://github.com/cheongcel/cheongcel" target="_blank" rel="noopener">GitHub</a>
                <span class="bh-pill bh-pill-b">Design</span>
                <span class="bh-pill bh-pill-c">Build</span>
            </div>
        </div>
    </div>

    <p class="bh-hint" id="bh-hint">드래그하거나 살짝 건드려보세요</p>

    <script th:src="@{/themes/badge/badge.js}" defer></script>
</section>
</body>
</html>
