spring:
  profiles:
    active: local
  application:
    name: cheongcel

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8081}

# 시즌별 디자인 테마 (static/themes/<이름>, templates/themes/<이름>)
# 환경변수 SITE_THEME 으로도 바꿀 수 있어요. 미리보기: 아무 주소 뒤에 ?theme=이름
site:
  theme: badge
  themes: badge,purple-wave

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:cheongcel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
